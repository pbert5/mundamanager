services:
  supabase:
    build:
      context: .
      dockerfile: Dockerfile.supabase-cli
    entrypoint: ["/bin/sh"]
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - standalone-runtime:/runtime
    command: ["/workspace/scripts/standalone-supabase.sh"]

  app:
    build:
      context: .
      dockerfile: Dockerfile.standalone
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}"
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
    network_mode: host
    depends_on:
      supabase:
        condition: service_completed_successfully
    volumes:
      - standalone-runtime:/runtime
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "${MUNDA_PORT:-19097}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:19097}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}"
    command: ["sh", "-c", "if [ -f /runtime/.env.standalone ]; then . /runtime/.env.standalone; export NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; fi; exec node server.js"]

  chrome-devtools-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.chrome-devtools-mcp
    profiles: ["development-tools"]
    init: true
    stdin_open: true
    tty: false
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  standalone-runtime:
